<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>롤플레이 핵심문장</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--tx:#1d2330;--sub:#6b7385;--pri:#2f5bd8;--ok:#1f9d55;--no:#e08a00;--bd:#e3e6ee}
@media(prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1c212c;--tx:#eef1f7;--sub:#9aa3b5;--pri:#6f93ff;--ok:#3ec97c;--no:#ffb43b;--bd:#2c3342}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
body{display:flex;flex-direction:column}
header{padding:14px 16px 6px;font-weight:700;font-size:17px}
main{flex:1;overflow-y:auto;padding:8px 16px 16px}
nav{display:flex;border-top:1px solid var(--bd);background:var(--card)}
nav button{flex:1;padding:14px 0;border:0;background:none;color:var(--sub);font-size:15px;font-weight:600}
nav button.on{color:var(--pri);border-top:3px solid var(--pri);padding-top:11px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chips button{padding:7px 14px;border-radius:999px;border:1px solid var(--bd);background:var(--card);color:var(--sub);font-size:14px;font-weight:600}
.chips button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.item{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.item .n{color:var(--sub);font-size:12px;margin-bottom:4px}
.item .k{font-size:16px;line-height:1.45}
.alt{font-size:14px;line-height:1.45;color:var(--sub);margin-top:8px;padding-top:8px;border-top:1px dashed var(--bd)}
.alt b{color:var(--ok);font-size:12px;margin-right:6px}
.item .e{font-size:16px;line-height:1.45;color:var(--pri);margin-top:6px;font-weight:600}
.stat{display:flex;gap:8px;justify-content:center;font-size:13px;color:var(--sub);margin-bottom:12px;flex-wrap:wrap}
.stat b{color:var(--tx)}
.big{background:var(--card);border:2px solid var(--bd);border-radius:18px;padding:28px 20px;min-height:230px;display:flex;flex-direction:column;justify-content:center;text-align:center;
 user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.big .k{font-size:22px;line-height:1.5;font-weight:600}
.big .e{font-size:20px;line-height:1.5;color:var(--pri);font-weight:700;margin-top:18px;min-height:30px;visibility:hidden}
.big .alt{border:0;margin-top:10px;font-size:16px;visibility:hidden;text-align:center;padding-top:0}
.big.show .e,.big.show .alt{visibility:visible}
.big.show{border-color:var(--pri)}
.hint{text-align:center;color:var(--sub);font-size:13px;margin:10px 0 16px}
.btns{display:flex;gap:12px}
.btns button{flex:1;padding:18px 0;border:0;border-radius:14px;font-size:18px;font-weight:700;color:#fff}
.ok{background:var(--ok)}.no{background:var(--no)}
.reset{margin-top:22px;width:100%;padding:12px;border:1px solid var(--bd);border-radius:12px;background:none;color:var(--sub);font-size:14px}
.done{text-align:center;padding:50px 10px;font-size:18px;line-height:1.7}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px;font-size:14px;line-height:1.6}
.panel h3{margin:0 0 6px;font-size:15px}
.up{display:block;width:100%;padding:16px 0;border:0;border-radius:14px;background:var(--pri);color:#fff;font-size:17px;font-weight:700;margin:10px 0}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--bd)}
.row button{border:1px solid var(--bd);background:none;color:var(--no);border-radius:8px;padding:6px 12px;font-size:13px}
.msg{margin-top:8px;font-size:14px;line-height:1.5}
code{background:var(--bg);padding:1px 5px;border-radius:4px}
</style>
</head>
<body>
<header>롤플레이 핵심문장</header>
<main id="main"></main>
<nav>
<button id="t1" class="on">전체 보기</button>
<button id="t2">암기 연습</button>
<button id="t3">업로드</button>
</nav>
<input type="file" id="file" accept=".xlsx,.xls" style="display:none">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
var BASE = [{"n":1,"k":"너희 집은 어디에 있어?","e":"Where is your house located exactly?","a":"Where exactly do you live?"},{"n":2,"k":"너희 집 까지 어떻게 가는 게 좋아?","e":"What's the best way to get to your place?","a":"What's the easiest way to get to your place?"},{"n":3,"k":"파티는 몇 시에 시작해?","e":"What time does your party start?","a":"When does the party kick off?"},{"n":4,"k":"내가 몇 시에 도착해야 돼?","e":"What time should I be there?","a":"When should I show up?"},{"n":5,"k":"어떤 음식 먹고 싶어?","e":"What kind of food do you want to eat?","a":"What are you in the mood for?"},{"n":6,"k":"내가 피자 가져갈까?","e":"Do you want me to bring pizza?","a":"Should I pick up a pizza on my way?"},{"n":7,"k":"몇 명 정도 와?","e":"How many people will be there?","a":"How many people are you expecting?"},{"n":8,"k":"그건 그렇고, 드레스코드 있어?","e":"By the way, is there a dress code?","a":"Oh, and what should I wear? Is it casual?"},{"n":9,"k":"거기까지 얼마나 걸려?","e":"How long does it take to get there?","a":"How long is the trip?"},{"n":10,"k":"여기서 얼마나 멀어?","e":"How far is the place from here?","a":"How far is it from here?"},{"n":11,"k":"너희 가게에서 가장 가까운 지하철역은 어디야?","e":"What is the nearest subway station to your shop?","a":"Which subway station is closest to your store?"},{"n":12,"k":"학원 근처에 유명한 건물 있어?","e":"Is there any famous building near the institute?","a":"Are there any landmarks near the institute?"},{"n":13,"k":"주소 문자로 보내줄 수 있어?","e":"Could you send me the exact address by text message?","a":"Can you text me the address?"},{"n":14,"k":"학원 근처에 유명한 건물 뭐 있어?","e":"What is a famous building near the institute?","a":"Is there a well-known building around the institute?"},{"n":15,"k":"첫 영화는 몇 시에 시작해?","e":"What time does the first show start?","a":"When does the first showing begin?"},{"n":16,"k":"7시 영화 2장 예약할 수 있어?","e":"Can I reserve two tickets for the 7 o'clock show?","a":"Can I book two seats for the 7 o'clock movie?"},{"n":17,"k":"영화 추천해줄 수 있어?","e":"Could you recommend a good movie?","a":"Any movie you'd recommend?"},{"n":18,"k":"뒷자리/앞자리/중간자리 가능해?","e":"Can I get seats in the back/front/middle?","a":"Are there any seats left in the back/front/middle?"},{"n":19,"k":"멤버십 얼마야?","e":"How much is the membership?","a":"What does a membership cost?"},{"n":20,"k":"요가 수업 있어?","e":"Do you offer yoga classes?","a":"Are there any yoga classes?"},{"n":21,"k":"러닝머신 몇 개 있어?","e":"How many treadmills do you have?","a":"How many treadmills are there?"},{"n":22,"k":"유니폼/수건 제공해?","e":"Do you offer a uniform/towel?","a":"Do you provide uniforms/towels?"},{"n":23,"k":"PT 선생님 있어?","e":"Do you have personal trainers?","a":"Is there a personal trainer I can work with?"},{"n":24,"k":"락커룸 쓰려면 추가 비용 내야 해?","e":"Is there an extra fee for using a locker?","a":"Do I have to pay extra to use a locker?"},{"n":25,"k":"5월 1일부터 3일까지 숙박하고 싶어요. 싱글룸/트윈룸 있나요?","e":"I'd like to stay from May 1st to May 3rd. Do you have a single/ twin room?","a":"I need a room from May 1st to May 3rd. Is a single/twin room available?"},{"n":26,"k":"1박에 얼마예요?","e":"How much is it per night?","a":"What's the rate per night?"},{"n":27,"k":"조식 포함되어 있나요?","e":"Is breakfast included?","a":"Does the price include breakfast?"},{"n":28,"k":"셔틀버스 있나요?","e":"Do you have a shuttle bus?","a":"Is there a shuttle service?"},{"n":29,"k":"체크인/체크아웃 몇 시인가요?","e":"What time is check-in/check-out?","a":"When is check-in/check-out?"},{"n":30,"k":"호텔에 헬스장/사우나/수영장 있나요?","e":"Does your hotel have a gym/sauna/swimming pool?","a":"Is there a gym/sauna/swimming pool in the hotel?"},{"n":31,"k":"공항에서 얼마나 걸리나요?","e":"How long does it take from the airport?","a":"How far is it from the airport?"},{"n":32,"k":"어떤 계좌가 있나요?","e":"What kinds of bank accounts do you have?","a":"What types of accounts can I open?"},{"n":33,"k":"이자율은 어떻게 되나요?","e":"What is the interest rate?","a":"What's the interest rate on that?"},{"n":34,"k":"이자 높은 계좌 추천해 줄 수 있나요?","e":"Could you recommend an account with a high interest rate?","a":"Which account would you recommend for the best interest?"},{"n":35,"k":"체크카드 발급받을 수 있나요?","e":"Can I get a debit card issued?","a":"Can I apply for a debit card?"},{"n":36,"k":"카드 재발급 받을 수 있나요?","e":"Can I get the card reissued?","a":"Is it possible to get a replacement card?"},{"n":37,"k":"어떤 서류가 필요하나요?","e":"What kinds of documents do you need?","a":"What documents do I need to bring?"},{"n":38,"k":"재발급 받는 데 얼마나 걸리나요?","e":"How long will it take to get it reissued?","a":"How long does it take to get a replacement?"},{"n":39,"k":"서류 작성해야 하나요?","e":"Do I have to fill out a form?","a":"Is there a form I need to fill out?"},{"n":40,"k":"BMW 있나요?","e":"Do you have a BMW?","a":"Do you have any BMWs available?"},{"n":41,"k":"흰색 있나요?","e":"Do you have it in white?","a":"Does it come in white?"},{"n":42,"k":"4명을 위한 SUV추천해 줄 수 있나요?","e":"I'd like to rent a car for 4 people. Can you recommend an SUV?","a":"We're a group of four. Which SUV would you suggest?"},{"n":43,"k":"7일 렌트 비용 얼마인가요?","e":"How much does it cost for seven days?","a":"What's the price for a week?"},{"n":44,"k":"보험 포함되어 있나요?","e":"Does it include insurance?","a":"Is insurance covered?"},{"n":45,"k":"어떤 서류가 필요하나요?","e":"What documents do you need?","a":"What paperwork do I need?"},{"n":46,"k":"어디서 픽업하고 어디서 반납하나요?","e":"Where can I pick up the car? Where can I return the car?","a":"Where do I pick it up, and where do I drop it off?"},{"n":47,"k":"몇 시에 열고 닫나요?","e":"What time do you open? What time do you close?","a":"What are your hours?"},{"n":48,"k":"매장이 공항 근처인가요?","e":"Is your shop near the airport?","a":"Is your store close to the airport?"},{"n":49,"k":"첫 수업은 몇 시에 시작하나요?","e":"What time does the first class start?","a":"When does the first lesson begin?"},{"n":50,"k":"제니퍼 수업 들을 수 있나요?","e":"Can I take Jennifer's class?","a":"Is it possible to sign up for Jennifer's class?"},{"n":51,"k":"초보자 수업 추천해 줄 수 있나요?","e":"Can you recommend a beginner class?","a":"What's a good class for beginners?"},{"n":52,"k":"준비물 있나요?","e":"Do I need to bring anything?","a":"Is there anything I should bring with me?"},{"n":53,"k":"유니폼 제공하나요?","e":"Do you provide a uniform?","a":"Do I get a uniform?"},{"n":54,"k":"강의실은 어디에 있나요?","e":"Where is the classroom?","a":"Where is the classroom located?"}];           // DAY1 (내장)
var KEY = "roleplay105_v2", KEY_OLD = "roleplay105_v1", KEY_DAYS = "roleplay105_days";

/* ---------- 데이터: DAY1(내장) + 업로드한 DAY ---------- */
var uploaded = [];             // [{id:2, items:[{n,k,e,a}]}]
try { uploaded = JSON.parse(localStorage.getItem(KEY_DAYS)) || []; } catch(e){}
function saveDays(){ try{ localStorage.setItem(KEY_DAYS, JSON.stringify(uploaded)); }catch(e){} }
function allDays(){
  var days=[{id:1, items:BASE}];
  uploaded.forEach(function(u){ days.push(u); });
  return days;
}
function allCards(scope){
  var out=[];
  allDays().forEach(function(d){
    if(scope!=='all' && scope!==d.id) return;
    d.items.forEach(function(it,i){ out.push({key:d.id+':'+i, day:d.id, n:it.n, k:it.k, e:it.e, a:it.a}); });
  });
  return out;
}
function cardByKey(key){
  var p=key.split(':'), d=+p[0], i=+p[1];
  var days=allDays();
  for(var x=0;x<days.length;x++) if(days[x].id===d){ var it=days[x].items[i]; if(!it) return null; return {key:key,day:d,n:it.n,k:it.k,e:it.e,a:it.a}; }
  return null;
}

/* ---------- 상태 ---------- */
var st = {status:{}, queue:[], cur:null, last:null, scope:'all'};
try {
  var s2 = JSON.parse(localStorage.getItem(KEY));
  if (s2 && s2.status) st = s2;
  else {
    var s1 = JSON.parse(localStorage.getItem(KEY_OLD));   // v1 기록 이전(DAY1)
    if (s1 && s1.status) for (var id in s1.status) st.status['1:'+(parseInt(id,10)-1)] = s1.status[id];
  }
} catch(e){}
if(!st.scope) st.scope='all';
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} }

function shuffle(a){ for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;} return a; }
function esc(x){ return String(x==null?'':x).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); }
function scopeValid(){ if(st.scope!=='all' && !allDays().some(function(d){return d.id===st.scope;})) st.scope='all'; }
function counts(){
  var k=0,u=0; allCards(st.scope).forEach(function(c){ var v=st.status[c.key]; if(v==='k')k++; else if(v==='u')u++; });
  return {k:k,u:u,total:allCards(st.scope).length};
}
function newCycle(avoid){
  var q = allCards(st.scope).filter(function(c){return st.status[c.key]!=='k';}).map(function(c){return c.key;});
  shuffle(q);
  if(q.length>1 && q[0]===avoid){ var t=q[0]; q[0]=q[1]; q[1]=t; }
  st.queue=q;
}
function next(){
  if(!st.queue.length) newCycle(st.last);
  st.cur = st.queue.length ? st.queue[0] : null;
  save();
}

/* ---------- 탭 ---------- */
var tab=1, main=document.getElementById('main');
function setTab(t){
  tab=t;
  for(var i=1;i<=3;i++) document.getElementById('t'+i).className = (i===t?'on':'');
  render();
}
[1,2,3].forEach(function(i){ document.getElementById('t'+i).onclick=function(){ setTab(i); }; });
function render(){ scopeValid(); (tab===1?renderList:tab===2?renderPractice:renderUpload)(); }

function chipsHtml(){
  var h='<div class="chips"><button data-s="all" class="'+(st.scope==='all'?'on':'')+'">전체</button>';
  allDays().forEach(function(d){ h+='<button data-s="'+d.id+'" class="'+(st.scope===d.id?'on':'')+'">DAY'+d.id+'</button>'; });
  return h+'</div>';
}
function bindChips(){
  var bs=main.querySelectorAll('.chips button');
  for(var i=0;i<bs.length;i++) bs[i].onclick=function(){
    var v=this.getAttribute('data-s'); var ns=(v==='all')?'all':parseInt(v,10);
    if(ns!==st.scope){ st.scope=ns; st.queue=[]; st.cur=null; st.last=null; save(); }
    render();
  };
}

/* ---------- 전체 보기 ---------- */
function altHtml(a){ return a?'<div class="alt"><b>이렇게도 가능해요</b>'+esc(a)+'</div>':''; }
function renderList(){
  var h=chipsHtml(), multi=(st.scope==='all'&&allDays().length>1), lastDay=null;
  allCards(st.scope).forEach(function(c){
    h+='<div class="item"><div class="n">'+(multi?'DAY'+c.day+' · ':'')+esc(c.n)+'</div><div class="k">'+esc(c.k)+'</div><div class="e">'+esc(c.e)+'</div>'+altHtml(c.a)+'</div>';
  });
  main.innerHTML=h; bindChips(); main.scrollTop=0;
}

/* ---------- 암기 연습 ---------- */
function renderPractice(){
  var curOk = st.cur!==null && st.queue.indexOf(st.cur)>=0 && cardByKey(st.cur);
  if(!curOk){ st.queue=st.queue.filter(function(k){return cardByKey(k);}); if(st.cur===null||!st.queue.length||st.queue.indexOf(st.cur)<0) { st.queue=[]; next(); } }
  var c=counts();
  var label=(st.scope==='all'?'전체':'DAY'+st.scope);
  var stat='<div class="stat"><span>'+label+'</span><span>외움 <b>'+c.k+'</b></span><span>헷갈림 <b>'+c.u+'</b></span><span>이번 사이클 남은 문장 <b>'+st.queue.length+'</b></span><span>전체 <b>'+c.total+'</b></span></div>';
  var resetBtn='<button class="reset" id="reset">'+label+' 외움/헷갈림 기록 초기화</button>';
  if(st.cur===null){
    main.innerHTML=chipsHtml()+stat+'<div class="done">'+(c.total? '🎉 모든 문장을 외웠어요!<br>수고하셨습니다.':'문장이 없습니다.')+'</div>'+resetBtn;
    bindChips(); document.getElementById('reset').onclick=doReset; return;
  }
  var d=cardByKey(st.cur);
  var multi=(st.scope==='all'&&allDays().length>1);
  main.innerHTML=chipsHtml()+stat+
   '<div class="big" id="card"><div style="color:var(--sub);font-size:13px;margin-bottom:10px">'+(multi?'DAY'+d.day+' · ':'')+'#'+esc(d.n)+'</div><div class="k">'+esc(d.k)+'</div><div class="e">'+esc(d.e)+'</div>'+(d.a?'<div class="alt"><b>이렇게도 가능해요</b>'+esc(d.a)+'</div>':'')+'</div>'+
   '<div class="hint">카드를 꾹 누르고 있으면 영어와 "이렇게도 가능해요"가 보여요</div>'+
   '<div class="btns"><button class="ok" id="bk">외움</button><button class="no" id="bu">헷갈림</button></div>'+resetBtn;
  bindChips();
  var card=document.getElementById('card');
  function on(e){ e.preventDefault(); card.classList.add('show'); }
  function off(){ card.classList.remove('show'); }
  card.addEventListener('pointerdown',on);
  ['pointerup','pointercancel','pointerleave'].forEach(function(n){card.addEventListener(n,off);});
  card.addEventListener('contextmenu',function(e){e.preventDefault();});
  card.addEventListener('selectstart',function(e){e.preventDefault();});
  document.getElementById('bk').onclick=function(){answer('k');};
  document.getElementById('bu').onclick=function(){answer('u');};
  document.getElementById('reset').onclick=doReset;
}
function answer(v){
  st.status[st.cur]=v; st.last=st.cur;
  st.queue.shift();
  next(); renderPractice(); main.scrollTop=0;
}
function doReset(){
  var label=(st.scope==='all'?'전체':'DAY'+st.scope);
  if(!confirm(label+'의 외움/헷갈림 기록을 모두 지우고 처음부터 다시 시작할까요?')) return;
  allCards(st.scope).forEach(function(c){ delete st.status[c.key]; });
  st.queue=[]; st.cur=null; st.last=null; next(); renderPractice();
}

/* ---------- 업로드 ---------- */
var uploadMsg='';
function renderUpload(){
  var h='<div class="panel"><h3>엑셀 파일로 DAY 추가</h3>'+
   '엑셀(.xlsx) 첫 번째 시트를 읽어요.<br>1행은 범례(번호, 한글, 영어, 이렇게도 가능해요), 2행부터 데이터예요.<br>'+
   '<b>A</b> 번호 · <b>B</b> 한글 · <b>C</b> 영어 · <b>D</b> 이렇게도 가능해요(비워도 돼요)'+
   '<button class="up" id="pick">엑셀 파일 선택해서 추가</button>'+
   '<div class="msg" id="msg">'+uploadMsg+'</div></div>';
  h+='<div class="panel"><h3>현재 DAY 목록</h3>';
  allDays().forEach(function(d){
    h+='<div class="row"><span>DAY'+d.id+' · '+d.items.length+'문장'+(d.id===1?' (기본)':'')+'</span>'+(d.id===1?'':'<button data-del="'+d.id+'">삭제</button>')+'</div>';
  });
  h+='</div>';
  main.innerHTML=h; main.scrollTop=0;
  document.getElementById('pick').onclick=function(){
    if(typeof XLSX==='undefined'){ uploadMsg='엑셀 읽기 도구를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.'; renderUpload(); return; }
    document.getElementById('file').click();
  };
  var ds=main.querySelectorAll('button[data-del]');
  for(var i=0;i<ds.length;i++) ds[i].onclick=function(){
    var id=parseInt(this.getAttribute('data-del'),10);
    if(!confirm('DAY'+id+'을(를) 삭제할까요? 해당 기록도 함께 지워져요.')) return;
    uploaded=uploaded.filter(function(u){return u.id!==id;}); saveDays();
    for(var k in st.status) if(k.indexOf(id+':')===0) delete st.status[k];
    st.queue=[]; st.cur=null; st.last=null; scopeValid(); save();
    uploadMsg='DAY'+id+'을(를) 삭제했어요.'; renderUpload();
  };
}
document.getElementById('file').onchange=function(ev){
  var f=ev.target.files[0]; ev.target.value=''; if(!f) return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var wb=XLSX.read(new Uint8Array(r.result),{type:'array'});
      var rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
      var items=[], skipped=0;
      for(var i=1;i<rows.length;i++){           // 1행(범례) 건너뜀
        var row=rows[i], k=String(row[1]==null?'':row[1]).trim(), e=String(row[2]==null?'':row[2]).trim(), a=String(row[3]==null?'':row[3]).trim();
        var n=String(row[0]==null?'':row[0]).trim();
        if(!k && !e){ continue; }
        if(!k || !e){ skipped++; continue; }
        items.push({n:n||String(items.length+1), k:k, e:e, a:a});
      }
      if(!items.length){ uploadMsg='⚠️ 읽을 수 있는 문장이 없어요. 2행부터 B열(한글), C열(영어)이 채워져 있는지 확인해 주세요.'; renderUpload(); return; }
      var nid=1; allDays().forEach(function(d){ if(d.id>=nid) nid=d.id+1; });
      uploaded.push({id:nid, items:items}); saveDays();
      st.queue=[]; st.cur=null; save();
      uploadMsg='✅ DAY'+nid+' 추가 완료 · '+items.length+'문장'+(skipped?' (한글/영어 중 하나가 빈 '+skipped+'행은 제외)':'');
    }catch(err){ uploadMsg='⚠️ 파일을 읽지 못했어요. .xlsx 파일이 맞는지 확인해 주세요.'; }
    renderUpload();
  };
  r.readAsArrayBuffer(f);
};

render();
</script>
</body>
</html>
