<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>롤플레이 핵심문장</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--tx:#1d2330;--sub:#6b7385;--pri:#2f5bd8;--ok:#1f9d55;--no:#e08a00;--bd:#e3e6ee}
@media(prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1c212c;--tx:#eef1f7;--sub:#9aa3b5;--pri:#6f93ff;--ok:#3ec97c;--no:#ffb43b;--bd:#2c3342}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
body{display:flex;flex-direction:column}
header{padding:14px 16px 6px;font-weight:700;font-size:17px}
main{flex:1;overflow-y:auto;padding:8px 16px 16px}
nav{display:flex;border-top:1px solid var(--bd);background:var(--card)}
nav button{flex:1;padding:14px 0;border:0;background:none;color:var(--sub);font-size:15px;font-weight:600}
nav button.on{color:var(--pri);border-top:3px solid var(--pri);padding-top:11px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chips button{padding:7px 14px;border-radius:999px;border:1px solid var(--bd);background:var(--card);color:var(--sub);font-size:14px;font-weight:600}
.chips button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.item{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.item .n{color:var(--sub);font-size:12px;margin-bottom:4px}
.item .k{font-size:16px;line-height:1.45}
.alt{font-size:14px;line-height:1.45;color:var(--sub);margin-top:8px;padding-top:8px;border-top:1px dashed var(--bd)}
.alt b{color:var(--ok);font-size:12px;margin-right:6px}
.item .e{font-size:16px;line-height:1.45;color:var(--pri);margin-top:6px;font-weight:600}
.stat{display:flex;gap:8px;justify-content:center;font-size:13px;color:var(--sub);margin-bottom:12px;flex-wrap:wrap}
.stat b{color:var(--tx)}
.big{background:var(--card);border:2px solid var(--bd);border-radius:18px;padding:28px 20px;min-height:230px;display:flex;flex-direction:column;justify-content:center;text-align:center;
 user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.big .k{font-size:22px;line-height:1.5;font-weight:600}
.big .e{font-size:20px;line-height:1.5;color:var(--pri);font-weight:700;margin-top:18px;min-height:30px;visibility:hidden}
.big .alt{border:0;margin-top:10px;font-size:16px;visibility:hidden;text-align:center;padding-top:0}
.big.show .e,.big.show .alt{visibility:visible}
.big.show{border-color:var(--pri)}
.hint{text-align:center;color:var(--sub);font-size:13px;margin:10px 0 16px}
.btns{display:flex;gap:12px}
.btns button{flex:1;padding:18px 0;border:0;border-radius:14px;font-size:18px;font-weight:700;color:#fff}
.ok{background:var(--ok)}.no{background:var(--no)}
.reset{margin-top:22px;width:100%;padding:12px;border:1px solid var(--bd);border-radius:12px;background:none;color:var(--sub);font-size:14px}
.done{text-align:center;padding:50px 10px;font-size:18px;line-height:1.7}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px;font-size:14px;line-height:1.6}
.panel h3{margin:0 0 6px;font-size:15px}
.up{display:block;width:100%;padding:16px 0;border:0;border-radius:14px;background:var(--pri);color:#fff;font-size:17px;font-weight:700;margin:10px 0}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--bd)}
.row button{border:1px solid var(--bd);background:none;color:var(--no);border-radius:8px;padding:6px 12px;font-size:13px}
.msg{margin-top:8px;font-size:14px;line-height:1.5}
code{background:var(--bg);padding:1px 5px;border-radius:4px}
</style>
</head>
<body>
<header>롤플레이 핵심문장</header>
<main id="main"></main>
<nav>
<button id="t1" class="on">전체 보기</button>
<button id="t2">암기 연습</button>
</nav>
<script>
var KEY = "roleplay105_v2", KEY_OLD = "roleplay105_v1", KEY_DAYS_CACHE = "roleplay105_days_cache";
var DAYS = [];                 // days.json 에서 불러온 [{id, items:[{n,k,e,a}]}]
function allDays(){ return DAYS; }
function allCards(scope){
  var out=[];
  DAYS.forEach(function(d){
    if(scope!=='all' && scope!==d.id) return;
    d.items.forEach(function(it,i){ out.push({key:d.id+':'+i, day:d.id, n:it.n, k:it.k, e:it.e, a:it.a}); });
  });
  return out;
}
function cardByKey(key){
  var p=key.split(':'), d=+p[0], i=+p[1];
  var days=allDays();
  for(var x=0;x<days.length;x++) if(days[x].id===d){ var it=days[x].items[i]; if(!it) return null; return {key:key,day:d,n:it.n,k:it.k,e:it.e,a:it.a}; }
  return null;
}

/* ---------- 상태 ---------- */
var st = {status:{}, queue:[], cur:null, last:null, scope:'all'};
try {
  var s2 = JSON.parse(localStorage.getItem(KEY));
  if (s2 && s2.status) st = s2;
  else {
    var s1 = JSON.parse(localStorage.getItem(KEY_OLD));   // v1 기록 이전(DAY1)
    if (s1 && s1.status) for (var id in s1.status) st.status['1:'+(parseInt(id,10)-1)] = s1.status[id];
  }
} catch(e){}
if(!st.scope) st.scope='all';
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} }

function shuffle(a){ for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;} return a; }
function esc(x){ return String(x==null?'':x).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); }
function scopeValid(){ if(st.scope!=='all' && !allDays().some(function(d){return d.id===st.scope;})) st.scope='all'; }
function counts(){
  var k=0,u=0; allCards(st.scope).forEach(function(c){ var v=st.status[c.key]; if(v==='k')k++; else if(v==='u')u++; });
  return {k:k,u:u,total:allCards(st.scope).length};
}
function newCycle(avoid){
  var q = allCards(st.scope).filter(function(c){return st.status[c.key]!=='k';}).map(function(c){return c.key;});
  shuffle(q);
  if(q.length>1 && q[0]===avoid){ var t=q[0]; q[0]=q[1]; q[1]=t; }
  st.queue=q;
}
function next(){
  if(!st.queue.length) newCycle(st.last);
  st.cur = st.queue.length ? st.queue[0] : null;
  save();
}

/* ---------- 탭 ---------- */
var tab=1, main=document.getElementById('main');
function setTab(t){
  tab=t;
  for(var i=1;i<=2;i++) document.getElementById('t'+i).className = (i===t?'on':'');
  render();
}
[1,2].forEach(function(i){ document.getElementById('t'+i).onclick=function(){ setTab(i); }; });
function render(){ scopeValid(); (tab===1?renderList:renderPractice)(); }

function chipsHtml(){
  var h='<div class="chips"><button data-s="all" class="'+(st.scope==='all'?'on':'')+'">전체</button>';
  allDays().forEach(function(d){ h+='<button data-s="'+d.id+'" class="'+(st.scope===d.id?'on':'')+'">DAY'+d.id+'</button>'; });
  return h+'</div>';
}
function bindChips(){
  var bs=main.querySelectorAll('.chips button');
  for(var i=0;i<bs.length;i++) bs[i].onclick=function(){
    var v=this.getAttribute('data-s'); var ns=(v==='all')?'all':parseInt(v,10);
    if(ns!==st.scope){ st.scope=ns; st.queue=[]; st.cur=null; st.last=null; save(); }
    render();
  };
}

/* ---------- 전체 보기 ---------- */
function altHtml(a){ return a?'<div class="alt"><b>이렇게도 가능해요</b>'+esc(a)+'</div>':''; }
function renderList(){
  var h=chipsHtml(), multi=(st.scope==='all'&&allDays().length>1), lastDay=null;
  allCards(st.scope).forEach(function(c){
    h+='<div class="item"><div class="n">'+(multi?'DAY'+c.day+' · ':'')+esc(c.n)+'</div><div class="k">'+esc(c.k)+'</div><div class="e">'+esc(c.e)+'</div>'+altHtml(c.a)+'</div>';
  });
  main.innerHTML=h; bindChips(); main.scrollTop=0;
}

/* ---------- 암기 연습 ---------- */
function renderPractice(){
  var curOk = st.cur!==null && st.queue.indexOf(st.cur)>=0 && cardByKey(st.cur);
  if(!curOk){ st.queue=st.queue.filter(function(k){return cardByKey(k);}); if(st.cur===null||!st.queue.length||st.queue.indexOf(st.cur)<0) { st.queue=[]; next(); } }
  var c=counts();
  var label=(st.scope==='all'?'전체':'DAY'+st.scope);
  var stat='<div class="stat"><span>'+label+'</span><span>외움 <b>'+c.k+'</b></span><span>헷갈림 <b>'+c.u+'</b></span><span>이번 사이클 남은 문장 <b>'+st.queue.length+'</b></span><span>전체 <b>'+c.total+'</b></span></div>';
  var resetBtn='<button class="reset" id="reset">'+label+' 외움/헷갈림 기록 초기화</button>';
  if(st.cur===null){
    main.innerHTML=chipsHtml()+stat+'<div class="done">'+(c.total? '🎉 모든 문장을 외웠어요!<br>수고하셨습니다.':'문장이 없습니다.')+'</div>'+resetBtn;
    bindChips(); document.getElementById('reset').onclick=doReset; return;
  }
  var d=cardByKey(st.cur);
  var multi=(st.scope==='all'&&allDays().length>1);
  main.innerHTML=chipsHtml()+stat+
   '<div class="big" id="card"><div style="color:var(--sub);font-size:13px;margin-bottom:10px">'+(multi?'DAY'+d.day+' · ':'')+'#'+esc(d.n)+'</div><div class="k">'+esc(d.k)+'</div><div class="e">'+esc(d.e)+'</div>'+(d.a?'<div class="alt"><b>이렇게도 가능해요</b>'+esc(d.a)+'</div>':'')+'</div>'+
   '<div class="hint">카드를 꾹 누르고 있으면 영어와 "이렇게도 가능해요"가 보여요</div>'+
   '<div class="btns"><button class="ok" id="bk">외움</button><button class="no" id="bu">헷갈림</button></div>'+resetBtn;
  bindChips();
  var card=document.getElementById('card');
  function on(e){ e.preventDefault(); card.classList.add('show'); }
  function off(){ card.classList.remove('show'); }
  card.addEventListener('pointerdown',on);
  ['pointerup','pointercancel','pointerleave'].forEach(function(n){card.addEventListener(n,off);});
  card.addEventListener('contextmenu',function(e){e.preventDefault();});
  card.addEventListener('selectstart',function(e){e.preventDefault();});
  document.getElementById('bk').onclick=function(){answer('k');};
  document.getElementById('bu').onclick=function(){answer('u');};
  document.getElementById('reset').onclick=doReset;
}
function answer(v){
  st.status[st.cur]=v; st.last=st.cur;
  st.queue.shift();
  next(); renderPractice(); main.scrollTop=0;
}
function doReset(){
  var label=(st.scope==='all'?'전체':'DAY'+st.scope);
  if(!confirm(label+'의 외움/헷갈림 기록을 모두 지우고 처음부터 다시 시작할까요?')) return;
  allCards(st.scope).forEach(function(c){ delete st.status[c.key]; });
  st.queue=[]; st.cur=null; st.last=null; next(); renderPractice();
}

/* ---------- 데이터 불러오기 ---------- */
function applyDays(list, fresh){
  DAYS=list;
  if(fresh){   // 저장소에 없는 DAY의 기록 정리
    var ids={}; list.forEach(function(d){ids[d.id]=1;});
    for(var k in st.status){ if(!ids[k.split(':')[0]]) delete st.status[k]; }
    st.queue=st.queue.filter(function(k){return cardByKey(k);});
    if(st.cur!==null && !cardByKey(st.cur)) st.cur=null;
    save();
  }
  render();
}
function loadDays(){
  main.innerHTML='<div class="done">불러오는 중…</div>';
  fetch('days.json',{cache:'no-cache'}).then(function(r){ if(!r.ok) throw 0; return r.json(); }).then(function(list){
    try{ localStorage.setItem(KEY_DAYS_CACHE, JSON.stringify(list)); }catch(e){}
    applyDays(list,true);
  }).catch(function(){
    var cached=null; try{ cached=JSON.parse(localStorage.getItem(KEY_DAYS_CACHE)); }catch(e){}
    if(cached && cached.length) applyDays(cached,false);
    else main.innerHTML='<div class="done">문장 데이터를 불러오지 못했어요.<br>인터넷 연결을 확인하고 새로고침해 주세요.</div>';
  });
}
loadDays();
</script>
</body>
</html>
